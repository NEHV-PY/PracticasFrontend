<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Ábaco Soroban Mamba</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
            margin: 0;
            padding: 0;
        }

        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #2c3e50;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }

        .abacus-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #1a252f;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
            position: relative;
        }

        .frame {
            border: 8px solid #d35400;
            padding: 10px;
            display: flex;
            gap: 15px;
            background-color: #34495e;
            position: relative;
            border-radius: 5px;
        }

        .separator-bar {
            position: absolute;
            top: 25%;
            left: 0;
            width: 100%;
            height: 10px;
            background-color: #d35400;
            z-index: 1;
            box-shadow: 0 2px 5px rgba(0,0,0,0.4);
        }

        .column {
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            height: 250px;
            width: 30px;
        }

        .column::before {
            content: '';
            position: absolute;
            top: 0;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 4px;
            background-color: #bdc3c7;
            z-index: 0;
        }

        .bead {
            width: 35px;
            height: 20px;
            background: linear-gradient(to bottom, #3498db, #2980b9); /* Azul en reposo */
            border-radius: 10px;
            position: absolute;
            z-index: 2;
            cursor: pointer;
            box-shadow: inset 0 2px 4px rgba(255,255,255,0.4), 0 2px 4px rgba(0,0,0,0.6);
            transition: top 0.15s ease-out, background 0.2s ease;
        }

        /* Estado activo: Amarillo suave al tocar/contar */
        .bead.active {
            background: linear-gradient(to bottom, #f1c40f, #f39c12);
        }

        /* Cuentas del cielo */
        .bead.heaven { top: 5px; }
        .bead.heaven.active { top: 35px; }

        /* Cuentas de la tierra */
        .bead.earth-1 { top: 110px; }
        .bead.earth-2 { top: 135px; }
        .bead.earth-3 { top: 160px; }
        .bead.earth-4 { top: 185px; }

        .bead.earth-1.active { top: 75px; }
        .bead.earth-2.active { top: 100px; }
        .bead.earth-3.active { top: 125px; }
        .bead.earth-4.active { top: 150px; }

        .value-display-container {
            display: flex;
            gap: 15px;
            margin-top: 10px;
            padding: 0 10px;
            width: 100%;
            justify-content: space-between;
        }

        .column-value {
            color: #f1c40f;
            font-size: 1.2rem;
            font-weight: bold;
            width: 30px;
            text-align: center;
        }

        .guide-dot {
            position: absolute;
            width: 4px;
            height: 4px;
            background-color: white;
            border-radius: 50%;
            top: 25%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 3;
            margin-top: 5px;
        }

        /* Botón circular de Reset con flecha curva */
        .reset-btn {
            margin-top: 20px;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background-color: #e74c3c;
            color: white;
            border: none;
            font-size: 1.8rem;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-shadow: 0 4px 8px rgba(0,0,0,0.4);
            transition: transform 0.2s, background-color 0.2s;
        }

        .reset-btn:hover {
            background-color: #c0392b;
            transform: scale(1.08);
        }

        .reset-btn:active {
            transform: scale(0.95) rotate(-45deg);
        }
    </style>
</head>
<body>

    <div class="abacus-container">
        <div class="frame" id="abacus-frame">
            <div class="separator-bar"></div>
        </div>
        
        <div class="value-display-container" id="value-display"></div>
    </div>

    <!-- Botón con icono de flecha antihoraria -->
    <button class="reset-btn" onclick="resetAbacus()" title="Resetear Ábaco">↺</button>

    <script>
        const numColumns = 13;
        const frame = document.getElementById('abacus-frame');
        const valueDisplay = document.getElementById('value-display');

        let abacusState = Array(numColumns).fill(0);

        function createAbacus() {
            for (let i = 0; i < numColumns; i++) {
                const colDiv = document.createElement('div');
                colDiv.className = 'column';
                colDiv.dataset.colIndex = i;

                if ((numColumns - 1 - i) % 3 === 0 && i !== numColumns -1) {
                    const dot = document.createElement('div');
                    dot.className = 'guide-dot';
                    colDiv.appendChild(dot);
                }

                const heavenBead = document.createElement('div');
                heavenBead.className = 'bead heaven';
                heavenBead.dataset.value = 5;
                heavenBead.addEventListener('click', () => toggleHeaven(i, heavenBead));
                colDiv.appendChild(heavenBead);

                for (let j = 1; j <= 4; j++) {
                    const earthBead = document.createElement('div');
                    earthBead.className = `bead earth-${j}`;
                    earthBead.dataset.pos = j;
                    earthBead.addEventListener('click', () => toggleEarth(i, j));
                    colDiv.appendChild(earthBead);
                }

                frame.appendChild(colDiv);

                const valDiv = document.createElement('div');
                valDiv.className = 'column-value';
                valDiv.id = `val-${i}`;
                valDiv.innerText = '0';
                valueDisplay.appendChild(valDiv);
            }
        }

        function toggleHeaven(colIndex, beadEl) {
            const isActive = beadEl.classList.contains('active');
            if (isActive) {
                beadEl.classList.remove('active');
                abacusState[colIndex] -= 5;
            } else {
                beadEl.classList.add('active');
                abacusState[colIndex] += 5;
            }
            updateDisplay(colIndex);
        }

        function toggleEarth(colIndex, posClicked) {
            const colEl = frame.children[colIndex + 1];
            
            let activeCount = 0;
            for(let i=1; i<=4; i++){
                if(colEl.querySelector(`.earth-${i}`).classList.contains('active')) activeCount++;
            }

            if (posClicked > activeCount) {
                for (let i = activeCount + 1; i <= posClicked; i++) {
                    colEl.querySelector(`.earth-${i}`).classList.add('active');
                    abacusState[colIndex] += 1;
                }
            } else {
                for (let i = activeCount; i >= posClicked; i--) {
                    colEl.querySelector(`.earth-${i}`).classList.remove('active');
                    abacusState[colIndex] -= 1;
                }
            }
            updateDisplay(colIndex);
        }

        function updateDisplay(colIndex) {
            document.getElementById(`val-${colIndex}`).innerText = abacusState[colIndex];
        }

        function resetAbacus() {
            abacusState = Array(numColumns).fill(0);
            const columns = document.querySelectorAll('.column');
            columns.forEach((col, colIndex) => {
                const beads = col.querySelectorAll('.bead');
                beads.forEach(bead => bead.classList.remove('active'));
                document.getElementById(`val-${colIndex}`).innerText = '0';
            });
        }

        createAbacus();
    </script>
</body>
</html>
